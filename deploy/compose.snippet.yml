# seo-cockpit — snippet to fold into ~/server/docker-compose.yml on the Pi.
#
# This file is a SNIPPET, not a standalone compose file: the two services below
# are meant to be pasted under the existing `services:` key alongside the other
# stacks. It is nonetheless valid on its own so `docker compose -f
# deploy/compose.snippet.yml config` can validate it.
#
# Layout on the target Pi (user `acko`, /home/acko/server):
#
#   ~/server/seo-cockpit/
#     src/       <- the git checkout (code only; this is the build context)
#     data/      <- seo.db lives here. PERSISTENT, deliberately OUTSIDE the
#                   checkout so a re-clone or a hard reset can never delete the
#                   collected history. The repo gitignores collector/data
#                   anyway, so it was never going to be version-controlled.
#     secrets/   <- service-account.json, chmod 600. Same reasoning.
#
# sites.yaml resolves `db_path: data/seo.db` and
# `service_account_path: secrets/service-account.json` RELATIVE to the working
# directory, which is why the mounts land at /app/data and /app/secrets exactly.
#
# Host port 8091 verified free on the target 2026-07-26. Already taken there:
# 80 homepage, 1880 nodered, 1883 mosquitto, 3000 grafana, 5000 changedetection,
# 8086 influxdb, 8090 ntfy, 51820/udp wireguard.

services:
  seo-cockpit-collector:
    build:
      # Context is the REPO ROOT (the checkout), which both Dockerfiles expect.
      context: ./seo-cockpit/src
      dockerfile: deploy/Dockerfile.collector
    image: seo-cockpit-collector:latest
    container_name: seo-cockpit-collector
    restart: unless-stopped
    working_dir: /app
    # Run as the HOST user that owns data/ and secrets/, overriding the
    # image's baked-in uid. The alternative — chowning data/ to 10001 — would
    # leave the database owned by a uid with no host account, so backing it up
    # or inspecting it would need sudo. Defaults suit a single-user Pi where
    # the first account is 1000; override in ~/server/.env if yours differs.
    user: "${SEO_COCKPIT_UID:-1000}:${SEO_COCKPIT_GID:-1000}"
    environment:
      # PSI + CrUX. The service account (mounted below) covers Search Console;
      # this key is separate and must have BOTH the PageSpeed Insights API and
      # the Chrome UX Report API enabled — a CrUX 403 raises rather than
      # degrading, so a key missing CrUX yields zero CWV snapshots.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in ~/server/.env}
      # ntfy push alerts. OPTIONAL and unset by default: with either of the
      # first two blank, alerting switches off and collection is unaffected.
      # Deliberately NOT `:?` — a missing notifier must never stop the
      # collector, which is the thing that actually matters.
      #
      # ntfy already runs on this Pi on host port 8090. Both containers are on
      # the same compose network, so the collector reaches it by SERVICE NAME
      # (e.g. http://ntfy) on its INTERNAL port — the 8090 host mapping is for
      # your browser, not for container-to-container traffic. Use the LAN
      # address only if ntfy lives outside this compose project.
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      # Only needed if the topic is access-protected.
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      TZ: UTC
    volumes:
      # The database. READ-WRITE here: this is the only writer.
      - ./seo-cockpit/data:/app/data
      # Config and credentials, both read-only. sites.yaml resolves db_path and
      # service_account_path RELATIVE to the working directory, which is why
      # the mounts land at /app/data and /app/secrets exactly.
      - ./seo-cockpit/src/collector/sites.yaml:/app/sites.yaml:ro
      - ./seo-cockpit/secrets:/app/secrets:ro
    # `serve` blocks on the scheduler: daily collection at 03:00 UTC and the
    # weekly ntfy digest Mondays 07:00 UTC. For one-shot commands, run a
    # throwaway container instead of changing this:
    #   docker compose run --rm seo-cockpit-collector \
    #     python -m seocockpit.schedule run --backfill
    #   docker compose run --rm seo-cockpit-collector \
    #     python -m seocockpit.schedule digest --dry-run

  seo-cockpit-dashboard:
    build:
      context: ./seo-cockpit/src
      dockerfile: deploy/Dockerfile.dashboard
    image: seo-cockpit-dashboard:latest
    container_name: seo-cockpit-dashboard
    restart: unless-stopped
    # Same host uid as the collector. This one only ever READS the database,
    # but matching keeps the two consistent and avoids surprises if Next ever
    # wants to write a cache directory.
    user: "${SEO_COCKPIT_UID:-1000}:${SEO_COCKPIT_GID:-1000}"
    depends_on:
      - seo-cockpit-collector
    environment:
      SEO_DB_PATH: /data/seo.db
      # Drives the health panel's schedule-aware "is the collector running"
      # check. These MUST match the collector's actual schedule or the panel
      # will report a healthy collector as down, which trains you to ignore it.
      COLLECTOR_SCHEDULE_HOUR: "3"
      COLLECTOR_GRACE_HOURS: "2"
      TZ: UTC
    volumes:
      # READ-ONLY, and that is load-bearing rather than decorative.
      #
      # It is only possible because the database stays in journal_mode=delete.
      # Under WAL, opening a database read-only still requires CREATING the
      # -shm sidecar, so a read-only mount fails outright with
      # SQLITE_READONLY_DIRECTORY — verified, not assumed. See DEPLOY.md.
      - ./seo-cockpit/data:/data:ro
    ports:
      # Host 8091 -> container 3000. VERIFY 8091 IS FREE on the Pi before
      # bringing this up (`docker compose ps`, `ss -ltnp | grep 8091`); if it
      # is taken, change the host side here and in the Homepage tile.
      - "8091:3000"
