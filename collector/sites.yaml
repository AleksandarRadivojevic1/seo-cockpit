db_path: data/seo.db
service_account_path: secrets/service-account.json
sites:
  - property: "sc-domain:alexrad.dev"
    slug: alexrad
    display_name: Alexrad
    brand_token: alexrad
  - property: "https://skedio.rs/"
    slug: skedio
    display_name: Skedio
    brand_token: skedio
    # Hand-written because skedio's only page slugs are /cene/ and /povrat/,
    # which are bare common nouns -- they generated 548 keywords about fuel
    # prices and a Serbian film before the stoplist caught them.
    #
    # Every seed below was validated against live autocomplete on
    # 2026-07-27; the count is what each actually returned. Ones that
    # returned government services or non-Serbian results were rejected:
    #   "online zakazivanje termina" -> pasos, licna karta, viza
    #   "crm za salon"               -> salon de belleza, salon de coiffure
    #
    # Note the vocabulary finding: Serbians search "aplikacija", not
    # "softver" or "program". "aplikacija za salon" returns 4 keywords;
    # "softver za salon" and "program za salon lepote" both return zero.
    discover_seeds:
      - "aplikacija za zakazivanje"   # 32
      - "aplikacija za salon"         # 4
      - "softver za zakazivanje"      # 2
      - "zakazivanje klijenata"       # 1
      - "aplikacija za frizere"       # 1
  - property: "https://optikacajs.rs/"
    slug: optika-cajs
    display_name: "Optika Cajs"
    brand_token: cajs
    # serp_location is DELIBERATELY UNSET, i.e. country-level Serbia.
    #
    # Measured 2026-07-27: SerpApi has no location entry for Leskovac. The
    # nearest supported city is "Nis,Serbia", ~45 km away. Substituting Nis
    # would quietly report a different city's competitors as this shop's own
    # -- a proxy dressed as a measurement, which is the mistake this project
    # keeps refusing to make. Country-level is honest, and a query that
    # really is local ("optika leskovac") carries its geography in the words.
    #
    # Set this to a canonical SerpApi name (note: no space after the comma)
    # if that trade-off ever changes.
